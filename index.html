<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Terminal Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'saddle-brown': '#8B4513',
              'terminal-bg-from': '#3a3a3a',
              'terminal-bg-to': '#2a2a2a',
              'terminal-text': '#c0c0c0',
              'terminal-prompt': '#d4a657',
              'sim-bg': '#d4b483',
              'sim-text-dark': '#5a3921',
              'sim-text-brown': '#8B4513'
            },
            fontFamily: {
              mono: ['"JetBrains Mono"', 'monospace'],
              handwritten: ['Caveat', 'cursive'],
            },
            animation: {
              blink: 'blink 1s infinite steps(1, start)',
              'fade-in': 'fadeIn 0.3s ease-out forwards',
              'dance': 'dance 4s ease-in-out infinite',
            },
            keyframes: {
              blink: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              dance: {
                '0%, 100%': { transform: 'translate(0, 0)' },
                '25%': { transform: 'translate(3px, -5px)' },
                '50%': { transform: 'translate(0, 0)' },
                '75%': { transform: 'translate(-3px, 5px)' },
              }
            }
          },
        },
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
